name: Build macOS Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal App (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Universal macOS App Bundle
        env:
          SKIP_APP_INSTALL: "1"
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Upload macOS Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFUTCampusNet-macOS
          path: HFUTCampusNet-macOS.zip
          if-no-files-found: error

  create-github-release:
    name: Publish macOS GitHub Release (on Tag)
    needs: [build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: HFUTCampusNet-macOS
          path: artifacts/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/macos/HFUTCampusNet-macOS.zip
